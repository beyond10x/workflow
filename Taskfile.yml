version: '3'

tasks:
  generate:
    desc: Generate the complete Workflow service from its pinned Service SDK revision.
    cmds:
      - |
        set -eu
        repo_root="{{.TASKFILE_DIR}}"
        sdk_repository="$(awk '$1 == "repository:" { print $2; exit }' "$repo_root/service.yaml")"
        sdk_revision="$(awk '$1 == "revision:" { print $2; exit }' "$repo_root/service.yaml")"
        tool_root="$repo_root/target/service-builder/$sdk_revision"
        cargo install --locked --git "$sdk_repository" --rev "$sdk_revision" \
          --root "$tool_root" service-builder
        "$tool_root/bin/service-builder" generate \
          --package "$repo_root/service.yaml" --output "$repo_root/generated"

  check:
    desc: Validate ESS, refuse generated drift, and test every generated Workflow surface.
    cmds:
      - |
        set -eu
        repo_root="{{.TASKFILE_DIR}}"
        ess_revision="ceb67b6b79ce3790cf705a6ad79ad6ee246f6b81"
        ess_root="$repo_root/target/ess/$ess_revision"
        cargo install --locked --git https://github.com/beyond10x/ess.git \
          --rev "$ess_revision" --root "$ess_root" --bin ess ess-cli
        ess_bin="$ess_root/bin/ess"
        "$ess_bin" specify validate --path "$repo_root/spec/workflow"
        sdk_repository="$(awk '$1 == "repository:" { print $2; exit }' "$repo_root/service.yaml")"
        sdk_revision="$(awk '$1 == "revision:" { print $2; exit }' "$repo_root/service.yaml")"
        tool_root="$repo_root/target/service-builder/$sdk_revision"
        cargo install --locked --git "$sdk_repository" --rev "$sdk_revision" \
          --root "$tool_root" service-builder
        "$tool_root/bin/service-builder" check \
          --package "$repo_root/service.yaml" --output "$repo_root/generated"
        check_root="$(mktemp -d)"
        cp -R "$repo_root/generated" "$check_root/generated"
        CARGO_TARGET_DIR="$repo_root/target/generated-service" \
          cargo test --manifest-path "$check_root/generated/rust/Cargo.toml"
        (
          cd "$check_root/generated/docs"
          pnpm install --no-frozen-lockfile
          pnpm build
        )
        rustfmt --edition 2024 --check \
          "$repo_root/generated/rust/src/lib.rs" \
          "$repo_root/generated/rust/src/main.rs" \
          "$repo_root/generated/rust/tests/generated_scenarios.rs"
        "$ess_bin" generate component compile \
          --path "$repo_root/generated/deployment/component.yaml" \
          --out "$check_root/component.ir.json"
        "$ess_bin" generate build compile \
          --path "$repo_root/generated/deployment/build.yaml" \
          --out "$check_root/build.ir.json"
        cmp "$check_root/component.ir.json" "$repo_root/generated/deployment/component.ir.json"
        cmp "$check_root/build.ir.json" "$repo_root/generated/deployment/build.ir.json"
        helm lint "$repo_root/generated/deployment/chart"
        grep -q 'pub struct WorkflowClient' "$repo_root/generated/rust/src/lib.rs"
        grep -q 'pub async fn http_router' "$repo_root/generated/rust/src/lib.rs"
        grep -q 'urn:b10x:workflow' "$repo_root/generated/http/openapi.json"
        grep -q 'workflows.read' "$repo_root/generated/http/openapi.json"
        grep -q 'workflows.manage' "$repo_root/generated/http/openapi.json"
        ! grep -R -n -E 'Unimplemented|unimplemented!|todo!' "$repo_root/generated"
