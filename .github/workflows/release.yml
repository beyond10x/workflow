name: Release ESS component

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: release-ess-component-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'beyond10x/workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: beyond10x/ess/.github/actions/release-component@22a98a4c793bbb9ba2007e4d2ae81b2dc3a2c53a
        with:
          service: workflow
          version: ${{ github.ref_name }}
          ess-revision: 22a98a4c793bbb9ba2007e4d2ae81b2dc3a2c53a
          rust-toolchain: "1.91.0"
          node-version: "22"
          pnpm-version: "10.17.1"
          component-path: generated/deployment/component.yaml
          build-path: generated/deployment/build.yaml
          build-ir: generated/deployment/build.ir.json
          runtime-ir: generated/deployment/runtime.ir.json
          image-repository: ghcr.io/beyond10x/workflow
          registry: ghcr.io
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          chart-namespace: oci://ghcr.io/beyond10x/charts
          evidence-repository: ghcr.io/beyond10x/workflow-evidence
          bundle-repository: ghcr.io/beyond10x/workflow-component
