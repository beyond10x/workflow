name: Release ESS component

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: release-ess-component-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'beyond10x/workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: beyond10x/service-sdk/.github/actions/release-component@c1051c1cd228ea397ce2de8ef36789fbfa8199d8
        with:
          service: workflow
          version: ${{ github.ref_name }}
          ess-revision: c739a2afb0647714d18ba194b904ee92c96703f4
          registry: ghcr.io
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}
          chart-namespace: oci://ghcr.io/beyond10x/charts
          evidence-repository: ghcr.io/beyond10x/workflow-evidence
          bundle-repository: ghcr.io/beyond10x/workflow-component
