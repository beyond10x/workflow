[workspace]
resolver = "2"
members = ["generated/rust"]

[workspace.package]
version = "0.3.6"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/workflow"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
