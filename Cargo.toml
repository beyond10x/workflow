[workspace]
resolver = "3"
members = ["crates/workflow-domain"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-B10x-Proprietary"
repository = "https://github.com/beyond10x/workflow"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
