format: service-definition/3
service: workflow
realm: optional
delivery:
  kind: identity_http
  audience: urn:b10x:workflow

obligations:
  - name: bind_workflow_stream
    provider: sdk.aggregate.event-sourced/v1
    bindings:
      aggregate: workflow.definition.Workflow
      identity: workflow_id
      category: workflow
    description: Fold every owned draft, graph, and revision inside one workflow stream.

  - name: authorize_workflow_access
    provider: sdk.auth.owner-and-conjunctive-scopes/v1
    bindings:
      owner: workflow.definition.Workflow.owner
      scopes: workflow.definition.Workflow.scopes
    description: Authorize against the workflow owner and conjunctive visibility scopes.

  - name: authorize_scope_binding
    provider: sdk.auth.requested-scopes/v1
    bindings: { scopes: scopes }
    description: Validate initial visibility scopes against verified authority facts.

  - name: require_workflow
    provider: sdk.lifecycle.require-state/v1
    bindings: { entity: workflow.definition.Workflow, allowed: Active }
    description: Require the selected workflow aggregate.

  - name: validate_draft_parent
    provider: sdk.aggregate.nested-entity/v1
    bindings:
      parent: workflow.definition.Workflow
      child: workflow.definition.WorkflowDraft
      parent_identity: workflow_id
      child_identity: draft_id
    description: Resolve a draft only inside its workflow stream.

  - name: validate_new_draft_parent
    provider: sdk.aggregate.nested-entity/v1
    bindings:
      parent: workflow.definition.Workflow
      child: workflow.definition.WorkflowDraft
      parent_identity: workflow_id
    description: Resolve the owning workflow before creating a draft.

  - name: require_active_draft
    provider: sdk.lifecycle.require-state/v1
    bindings: { entity: workflow.definition.WorkflowDraft, identity: draft_id, allowed: Active }
    description: Only active drafts can be edited, checked, published, or discarded.

  - name: validate_node_parent
    provider: sdk.aggregate.nested-entity/v1
    bindings:
      parent: workflow.definition.WorkflowDraft
      child: workflow.definition.DraftNode
      parent_identity: draft_id
      child_identity: node_id
    description: Resolve a node only inside the selected draft and workflow stream.

  - name: validate_new_node_parent
    provider: sdk.aggregate.nested-entity/v1
    bindings:
      parent: workflow.definition.WorkflowDraft
      child: workflow.definition.DraftNode
      parent_identity: draft_id
    description: Resolve the draft before adding a node.

  - name: require_active_node
    provider: sdk.lifecycle.require-state/v1
    bindings: { entity: workflow.definition.DraftNode, identity: node_id, allowed: Active }
    description: Removed nodes cannot be replaced or removed again.

  - name: validate_edge_parent
    provider: sdk.aggregate.nested-entity/v1
    bindings:
      parent: workflow.definition.WorkflowDraft
      child: workflow.definition.DraftEdge
      parent_identity: draft_id
      child_identity: edge_id
    description: Resolve an edge only inside the selected draft and workflow stream.

  - name: require_active_edge
    provider: sdk.lifecycle.require-state/v1
    bindings: { entity: workflow.definition.DraftEdge, identity: edge_id, allowed: Active }
    description: Disconnected edges cannot be disconnected again.

  - name: derive_draft_authority
    provider: sdk.derive.inherit-parent-authority/v2
    bindings:
      parent: workflow.definition.Workflow
      child: workflow.definition.WorkflowDraft
      parent_owner: workflow.definition.Workflow.owner
      parent_scopes: workflow.definition.Workflow.scopes
      child_owner: workflow.definition.WorkflowDraft.owner
      child_scopes: workflow.definition.WorkflowDraft.scopes
    description: Drafts inherit the current workflow authority.

  - name: derive_revision_authority
    provider: sdk.derive.inherit-parent-authority/v2
    bindings:
      parent: workflow.definition.Workflow
      child: workflow.definition.WorkflowRevision
      parent_owner: workflow.definition.Workflow.owner
      parent_scopes: workflow.definition.Workflow.scopes
      child_owner: workflow.definition.WorkflowRevision.owner
      child_scopes: workflow.definition.WorkflowRevision.scopes
    description: Published revisions inherit immutable workflow authority metadata.

  - name: connect_draft_dag
    provider: sdk.graph.connect-dag/v1
    bindings:
      nodes: workflow.definition.DraftNode
      edges: workflow.definition.DraftEdge
      partition: draft_id
      node_partition: draft_id
      edge_partition: draft_id
      node_identity: node_id
      edge_source: source_node_id
      edge_target: target_node_id
      source: source_node_id
      target: target_node_id
      active_state: Active
      max_nodes: "500"
      max_edges: "2000"
    description: Refuse missing, self, duplicate, or cyclic graph connections.

  - name: remove_unreferenced_node
    provider: sdk.graph.node-unreferenced/v1
    bindings:
      nodes: workflow.definition.DraftNode
      edges: workflow.definition.DraftEdge
      partition: draft_id
      node_partition: draft_id
      edge_partition: draft_id
      node_identity: node_id
      edge_source: source_node_id
      edge_target: target_node_id
      node: node_id
      active_state: Active
    description: Require explicit edge disconnection before node removal.

  - name: publish_draft_snapshot
    provider: sdk.graph.publish-snapshot/v1
    bindings:
      nodes: workflow.definition.DraftNode
      edges: workflow.definition.DraftEdge
      partition: draft_id
      node_partition: draft_id
      edge_partition: draft_id
      node_identity: node_id
      edge_identity: edge_id
      edge_source: source_node_id
      edge_target: target_node_id
      active_state: Active
      max_nodes: "500"
      max_edges: "2000"
    description: Validate and materialize one canonical immutable revision snapshot and digest.

  - name: activate_owned_revision
    provider: sdk.aggregate.owned-revision/v1
    bindings:
      revision: workflow.definition.WorkflowRevision
      revision_identity: revision_id
      allowed: Published
    description: Only a published revision already owned by this workflow stream can be activated.

  - name: partition_projection_by_auth
    provider: sdk.projection.conjunctive-scopes-visibility/v1
    bindings: { scopes: scopes }
    description: Materialize hidden tenant and exact optional-realm partitions with scoped reads.

  - name: filter_visible_workflows
    provider: sdk.projection.conjunctive-scopes-visibility/v1
    bindings: { scopes: scopes }
    description: Filter workflow rows by verified scope facts without conferring ownership.

  - name: filter_visible_drafts
    provider: sdk.projection.conjunctive-scopes-visibility/v1
    bindings: { scopes: scopes, parent: workflow.definition.Workflow }
    description: Filter draft rows by inherited workflow authority.

  - name: filter_visible_revisions
    provider: sdk.projection.conjunctive-scopes-visibility/v1
    bindings: { scopes: scopes, parent: workflow.definition.Workflow }
    description: Filter revision rows by inherited workflow authority.

projections:
  - name: workflow_by_id_projection
    view: workflow.definition.WorkflowById
    delivery: inline_transactional
    obligations: [partition_projection_by_auth]
  - name: workflows_projection
    view: workflow.definition.Workflows
    delivery: inline_transactional
    obligations: [partition_projection_by_auth, filter_visible_workflows]
  - name: draft_by_id_projection
    view: workflow.definition.DraftById
    delivery: inline_transactional
    obligations: [partition_projection_by_auth, derive_draft_authority, filter_visible_drafts]
  - name: drafts_projection
    view: workflow.definition.Drafts
    delivery: inline_transactional
    obligations: [partition_projection_by_auth, derive_draft_authority, filter_visible_drafts]
  - name: revision_by_id_projection
    view: workflow.definition.RevisionById
    delivery: inline_transactional
    obligations: [partition_projection_by_auth, derive_revision_authority, filter_visible_revisions]
  - name: revisions_projection
    view: workflow.definition.Revisions
    delivery: inline_transactional
    obligations: [partition_projection_by_auth, derive_revision_authority, filter_visible_revisions]

intents:
  - name: create_workflow
    scope: workflows.manage
    command: workflow.definition.CreateWorkflow
    stream_id: { kind: generated_uuid_v7 }
    expected_version: { kind: no_stream }
    idempotency: { kind: operation_field, field: idempotency_key }
    guards:
      - name: may_create_workflow
        refusal_code: workflow_creation_forbidden
        reads:
          - { kind: command_field, field: scopes }
          - { kind: context, value: tenant_id }
          - { kind: context, value: realm_id_optional }
          - { kind: context, value: current_authority }
    event_bindings:
      - { event: workflow.definition.WorkflowCreated, field: workflow_id, source: { kind: stream_id } }
      - { event: workflow.definition.WorkflowCreated, field: owner, source: { kind: context, value: current_authority } }
    projections: [workflow_by_id_projection, workflows_projection]
    obligations: [bind_workflow_stream, authorize_scope_binding]

  - name: create_draft
    scope: workflows.manage
    command: workflow.definition.CreateDraft
    stream_id: { kind: command_field, field: workflow_id }
    expected_version: { kind: operation_field, field: expected_version }
    idempotency: { kind: operation_field, field: idempotency_key }
    guards:
      - name: may_create_draft
        refusal_code: workflow_access_forbidden
        reads:
          - { kind: command_field, field: workflow_id }
          - { kind: context, value: current_authority }
    event_bindings:
      - { event: workflow.definition.DraftCreated, field: draft_id, source: { kind: generated_uuid_v7 } }
      - { event: workflow.definition.DraftCreated, field: owner, source: { kind: obligation, name: derive_draft_authority } }
      - { event: workflow.definition.DraftCreated, field: scopes, source: { kind: obligation, name: derive_draft_authority } }
    projections: [draft_by_id_projection, drafts_projection]
    obligations: [bind_workflow_stream, authorize_workflow_access, require_workflow, validate_new_draft_parent, derive_draft_authority]

  - name: discard_draft
    scope: workflows.manage
    command: workflow.definition.DiscardDraft
    stream_id: { kind: command_field, field: workflow_id }
    expected_version: { kind: operation_field, field: expected_version }
    idempotency: { kind: operation_field, field: idempotency_key }
    guards: [{ name: may_discard_draft, refusal_code: workflow_access_forbidden, reads: [{ kind: command_field, field: workflow_id }, { kind: command_field, field: draft_id }, { kind: context, value: current_authority }] }]
    projections: [draft_by_id_projection, drafts_projection]
    obligations: [bind_workflow_stream, authorize_workflow_access, validate_draft_parent, require_active_draft]

  - name: validate_draft
    scope: workflows.manage
    command: workflow.definition.ValidateDraft
    stream_id: { kind: command_field, field: workflow_id }
    expected_version: { kind: operation_field, field: expected_version }
    idempotency: { kind: operation_field, field: idempotency_key }
    guards: [{ name: may_validate_draft, refusal_code: workflow_access_forbidden, reads: [{ kind: command_field, field: workflow_id }, { kind: command_field, field: draft_id }, { kind: context, value: current_authority }] }]
    projections: [draft_by_id_projection, drafts_projection]
    obligations: [bind_workflow_stream, authorize_workflow_access, validate_draft_parent, require_active_draft, publish_draft_snapshot]

  - name: publish_draft
    scope: workflows.manage
    command: workflow.definition.PublishDraft
    stream_id: { kind: command_field, field: workflow_id }
    expected_version: { kind: operation_field, field: expected_version }
    idempotency: { kind: operation_field, field: idempotency_key }
    guards: [{ name: may_publish_draft, refusal_code: workflow_access_forbidden, reads: [{ kind: command_field, field: workflow_id }, { kind: command_field, field: draft_id }, { kind: context, value: current_authority }] }]
    event_bindings:
      - { event: workflow.definition.RevisionPublished, field: revision_id, source: { kind: generated_uuid_v7 } }
      - { event: workflow.definition.RevisionPublished, field: nodes, source: { kind: obligation, name: publish_draft_snapshot } }
      - { event: workflow.definition.RevisionPublished, field: edges, source: { kind: obligation, name: publish_draft_snapshot } }
      - { event: workflow.definition.RevisionPublished, field: digest, source: { kind: obligation, name: publish_draft_snapshot } }
      - { event: workflow.definition.RevisionPublished, field: node_count, source: { kind: obligation, name: publish_draft_snapshot } }
      - { event: workflow.definition.RevisionPublished, field: edge_count, source: { kind: obligation, name: publish_draft_snapshot } }
      - { event: workflow.definition.RevisionPublished, field: owner, source: { kind: obligation, name: derive_revision_authority } }
      - { event: workflow.definition.RevisionPublished, field: scopes, source: { kind: obligation, name: derive_revision_authority } }
    projections: [revision_by_id_projection, revisions_projection]
    obligations: [bind_workflow_stream, authorize_workflow_access, validate_draft_parent, require_active_draft, publish_draft_snapshot, derive_revision_authority]

  - name: activate_revision
    scope: workflows.manage
    command: workflow.definition.ActivateRevision
    stream_id: { kind: command_field, field: workflow_id }
    expected_version: { kind: operation_field, field: expected_version }
    idempotency: { kind: operation_field, field: idempotency_key }
    guards: [{ name: may_activate_revision, refusal_code: workflow_access_forbidden, reads: [{ kind: command_field, field: workflow_id }, { kind: command_field, field: revision_id }, { kind: context, value: current_authority }] }]
    projections: [workflow_by_id_projection, workflows_projection]
    obligations: [bind_workflow_stream, authorize_workflow_access, require_workflow, activate_owned_revision]

  - name: add_node
    scope: workflows.manage
    command: workflow.definition.AddNode
    stream_id: { kind: command_field, field: workflow_id }
    expected_version: { kind: operation_field, field: expected_version }
    idempotency: { kind: operation_field, field: idempotency_key }
    guards: [{ name: may_add_node, refusal_code: workflow_access_forbidden, reads: [{ kind: command_field, field: workflow_id }, { kind: command_field, field: draft_id }, { kind: context, value: current_authority }] }]
    event_bindings: [{ event: workflow.definition.NodeAdded, field: node_id, source: { kind: generated_uuid_v7 } }]
    projections: []
    obligations: [bind_workflow_stream, authorize_workflow_access, validate_draft_parent, require_active_draft, validate_new_node_parent]

  - name: replace_node
    scope: workflows.manage
    command: workflow.definition.ReplaceNode
    stream_id: { kind: command_field, field: workflow_id }
    expected_version: { kind: operation_field, field: expected_version }
    idempotency: { kind: operation_field, field: idempotency_key }
    guards: [{ name: may_replace_node, refusal_code: workflow_access_forbidden, reads: [{ kind: command_field, field: workflow_id }, { kind: command_field, field: draft_id }, { kind: command_field, field: node_id }, { kind: context, value: current_authority }] }]
    projections: []
    obligations: [bind_workflow_stream, authorize_workflow_access, validate_draft_parent, require_active_draft, validate_node_parent, require_active_node]

  - name: remove_node
    scope: workflows.manage
    command: workflow.definition.RemoveNode
    stream_id: { kind: command_field, field: workflow_id }
    expected_version: { kind: operation_field, field: expected_version }
    idempotency: { kind: operation_field, field: idempotency_key }
    guards: [{ name: may_remove_node, refusal_code: workflow_access_forbidden, reads: [{ kind: command_field, field: workflow_id }, { kind: command_field, field: draft_id }, { kind: command_field, field: node_id }, { kind: context, value: current_authority }] }]
    projections: []
    obligations: [bind_workflow_stream, authorize_workflow_access, validate_draft_parent, require_active_draft, validate_node_parent, require_active_node, remove_unreferenced_node]

  - name: connect_nodes
    scope: workflows.manage
    command: workflow.definition.ConnectNodes
    stream_id: { kind: command_field, field: workflow_id }
    expected_version: { kind: operation_field, field: expected_version }
    idempotency: { kind: operation_field, field: idempotency_key }
    guards: [{ name: may_connect_nodes, refusal_code: workflow_access_forbidden, reads: [{ kind: command_field, field: workflow_id }, { kind: command_field, field: draft_id }, { kind: command_field, field: source_node_id }, { kind: command_field, field: target_node_id }, { kind: context, value: current_authority }] }]
    event_bindings: [{ event: workflow.definition.NodesConnected, field: edge_id, source: { kind: generated_uuid_v7 } }]
    projections: []
    obligations: [bind_workflow_stream, authorize_workflow_access, validate_draft_parent, require_active_draft, connect_draft_dag]

  - name: disconnect_nodes
    scope: workflows.manage
    command: workflow.definition.DisconnectNodes
    stream_id: { kind: command_field, field: workflow_id }
    expected_version: { kind: operation_field, field: expected_version }
    idempotency: { kind: operation_field, field: idempotency_key }
    guards: [{ name: may_disconnect_nodes, refusal_code: workflow_access_forbidden, reads: [{ kind: command_field, field: workflow_id }, { kind: command_field, field: draft_id }, { kind: command_field, field: edge_id }, { kind: context, value: current_authority }] }]
    projections: []
    obligations: [bind_workflow_stream, authorize_workflow_access, validate_draft_parent, require_active_draft, validate_edge_parent, require_active_edge]

queries:
  - name: list_workflows
    scope: workflows.read
    view: workflow.definition.Workflows
    projection: workflows_projection
    selectors: []
    guards: [{ name: workflow_is_visible, refusal_code: workflow_not_visible, reads: [{ kind: view_field, field: owner }, { kind: view_field, field: scopes }, { kind: context, value: tenant_id }, { kind: context, value: realm_id_optional }, { kind: context, value: current_authority }] }]
    sort: [{ view_field: workflow_id, direction: ascending }]
    delivery: read_your_writes
    obligations: [partition_projection_by_auth, filter_visible_workflows]
  - name: get_workflow
    scope: workflows.read
    view: workflow.definition.WorkflowById
    projection: workflow_by_id_projection
    selectors: [{ parameter: workflow_id, view_field: workflow_id }]
    guards: [{ name: workflow_is_visible, refusal_code: workflow_not_found, reads: [{ kind: view_field, field: owner }, { kind: view_field, field: scopes }, { kind: context, value: current_authority }] }]
    sort: [{ view_field: workflow_id, direction: ascending }]
    delivery: read_your_writes
    obligations: [partition_projection_by_auth, filter_visible_workflows]
  - name: list_drafts
    scope: workflows.read
    view: workflow.definition.Drafts
    projection: drafts_projection
    selectors: [{ parameter: workflow_id, view_field: workflow_id }]
    guards: [{ name: draft_is_visible, refusal_code: draft_not_visible, reads: [{ kind: view_field, field: owner }, { kind: view_field, field: scopes }, { kind: context, value: current_authority }] }]
    sort: [{ view_field: draft_id, direction: ascending }]
    delivery: read_your_writes
    obligations: [partition_projection_by_auth, filter_visible_drafts]
  - name: get_draft
    scope: workflows.read
    view: workflow.definition.DraftById
    projection: draft_by_id_projection
    selectors: [{ parameter: workflow_id, view_field: workflow_id }, { parameter: draft_id, view_field: draft_id }]
    guards: [{ name: draft_is_visible, refusal_code: draft_not_found, reads: [{ kind: view_field, field: owner }, { kind: view_field, field: scopes }, { kind: context, value: current_authority }] }]
    sort: [{ view_field: draft_id, direction: ascending }]
    delivery: read_your_writes
    obligations: [partition_projection_by_auth, filter_visible_drafts]
  - name: list_revisions
    scope: workflows.read
    view: workflow.definition.Revisions
    projection: revisions_projection
    selectors: [{ parameter: workflow_id, view_field: workflow_id }]
    guards: [{ name: revision_is_visible, refusal_code: revision_not_visible, reads: [{ kind: view_field, field: owner }, { kind: view_field, field: scopes }, { kind: context, value: current_authority }] }]
    sort: [{ view_field: revision_id, direction: ascending }]
    delivery: read_your_writes
    obligations: [partition_projection_by_auth, filter_visible_revisions]
  - name: get_revision
    scope: workflows.read
    view: workflow.definition.RevisionById
    projection: revision_by_id_projection
    selectors: [{ parameter: workflow_id, view_field: workflow_id }, { parameter: revision_id, view_field: revision_id }]
    guards: [{ name: revision_is_visible, refusal_code: revision_not_found, reads: [{ kind: view_field, field: owner }, { kind: view_field, field: scopes }, { kind: context, value: current_authority }] }]
    sort: [{ view_field: revision_id, direction: ascending }]
    delivery: read_your_writes
    obligations: [partition_projection_by_auth, filter_visible_revisions]
