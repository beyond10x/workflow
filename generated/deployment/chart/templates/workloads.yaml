{{- $root := . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-workflow
spec:
  replicas: {{ index .Values.workloads "workflow" "replicas" }}
  serviceName: {{ .Release.Name }}-workflow-headless
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: workflow
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: workflow
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: server
          image: "{{ index .Values.images "app" "repository" }}@{{ index .Values.images "app" "digest" }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: "/var/lib/workflow"
          env:
            - name: WORKFLOW_DATABASE_PATH
              value: "/var/lib/workflow/workflow.sqlite3"
            - name: WORKFLOW_IDENTITY_ORIGIN
              value: {{ index .Values.endpoints "identity" | quote }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with (index $root.Values.workloads "workflow" "volumes" "data" "class") }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ index $root.Values.workloads "workflow" "volumes" "data" "size" | quote }}
